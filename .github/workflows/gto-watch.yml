name: GTO watch

on:
  schedule:
    # Mondays, 14:29 UTC (7:29 a.m. Arizona)
    - cron: "29 14 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  watch:
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check the Federal Register for new GTOs
        run: python -m ctr_monitor.gto_watch | tee watch.log

      - name: Commit and open a review issue if anything is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "GTO watch: new order found $(date -u +%Y-%m-%d)"
          git push
          {
            echo "The weekly GTO watch found a new or reissued FinCEN GTO."
            echo
            echo '```'
            cat watch.log
            echo '```'
            echo
            echo "Before updating \`data/gto_zips.csv\`:"
            echo "- [ ] Read the order: effective date, expiration, threshold"
            echo "- [ ] Check the draft ZIP list in \`data/proposed/\` against the order"
            echo "- [ ] Update \`data/gto_zips.csv\` and the constants in \`ctr_monitor/rules.py\`"
            echo "- [ ] Mark the old order superseded in \`data/gto_orders.csv\`"
          } > issue.md
          gh issue create --title "New FinCEN GTO to review" --body-file issue.md
